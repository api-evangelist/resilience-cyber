name: Resilience
kind: company
description: >-
  Resilience is a United States cyber-risk company that underwrites cyber
  insurance and technology errors-and-omissions coverage while running the
  security analytics and claims service around it. Founded in 2016 by operators
  out of US military and intelligence backgrounds and headquartered in San
  Francisco, it distributes through brokers rather than direct-to-consumer, and
  positions itself as a specialty cyber carrier whose underwriting is fed by its
  own risk model — the Threatonomics Risk Graph — plus a 24/7 in-house Risk
  Operations Center and claims/incident-response team. Product lines are cyber
  insurance, technology E&O, claims and incident response, security investment
  prioritization, and multi-entity/portfolio risk, sold in the US and in UK,
  Canadian, German, French, Italian and Spanish locales. Its API posture is
  partner-gated and honest to record as such: there is no developer portal, no
  public API reference, no downloadable OpenAPI, and no public Postman
  collection anywhere on cyberresilience.com. The only machine-facing surface is
  portal.cyberresilience.com, a client and broker application that 302-redirects
  to an Auth0 tenant at auth.cyberresilience.com requesting an access token for
  the private audience https://api.prod.resilienceinsurance.app — an internal
  product API, not a published one. No ACORD, AL3, ACORD XML, NGDS, IVANS,
  Applied Epic or Vertafore reference appears anywhere on the public site, which
  is itself a finding for a US specialty carrier: this is a direct-underwriting,
  broker-relationship distribution model rather than an agency-download one.
