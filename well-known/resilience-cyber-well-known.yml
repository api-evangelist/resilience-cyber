generated: '2026-07-25'
method: searched
source: live probes of every Resilience host on 2026-07-25
note: >-
  Resilience publishes no developer portal, so the only real /.well-known/
  surface on the estate is the Auth0 tenant that guards the client/broker
  portal. Every /.well-known/ path on the WordPress marketing host
  (cyberresilience.com) returns HTTP 200 but serves the marketing homepage
  byte-for-byte — a WordPress soft 404, not a document. Those are recorded
  below with status 200 and soft_404: true so a later round does not mistake
  the status code for a real hit. The private product API host
  (api.prod.resilienceinsurance.app) 404s every discovery path anonymously.
hosts:
- host: https://auth.cyberresilience.com
  role: Auth0 authorization server for the gated client/broker portal
- host: https://cyberresilience.com
  role: WordPress marketing site (soft-404s every unknown path)
- host: https://api.prod.resilienceinsurance.app
  role: private product API audience (not published)
- host: https://portal.cyberresilience.com
  role: gated client/broker application
- host: https://trust.cyberresilience.com
  role: Vanta-hosted Trust Center (client-rendered single-page app)
documents:
- host: https://auth.cyberresilience.com
  path: /.well-known/openid-configuration
  status: 200
  file: resilience-cyber-openid-configuration.json
  standard: OpenID Connect Discovery 1.0
- host: https://auth.cyberresilience.com
  path: /.well-known/oauth-authorization-server
