security_txt:
  published: false
  note: >-
    No RFC 9116 security.txt on any Resilience host. No HackerOne
    (hackerone.com/cyberresilience 404) or Bugcrowd (bugcrowd.com/cyberresilience
    404) program, and /security, /responsible-disclosure, /vulnerability-disclosure
    all soft-404 to the homepage. Notable for a cyber-insurance carrier.
