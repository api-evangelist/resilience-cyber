aid: resilience-cyber
name: Resilience
review:
  question: Does Resilience publish a public, self-serve developer portal or downloadable API specifications for its cyber insurance products?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: specialty-cyber
findings:
  summary: |
    Resilience (cyberresilience.com) publishes NO public developer portal, NO
    API reference, and NO downloadable OpenAPI/Swagger specification. Every
    conventional developer path was probed on 2026-07-25 and each is either a
    non-resolving host or a WordPress soft-404 that returns the marketing
    homepage byte-for-byte (630,315 bytes, <title>Home Page - Resilience</title>).
    The only machine-facing surface found is portal.cyberresilience.com, a
    client/broker application that immediately 302-redirects to an Auth0 tenant
    at auth.cyberresilience.com. That redirect is the single most informative
    artifact on the estate: it requests an authorization-code + PKCE (S256)
    token for the audience https://api.prod.resilienceinsurance.app — a private
    product API that exists but is not published. That host returns 404 for
    /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs,
    /docs, /spec, /redoc, /graphql and /health, and serves no
    .well-known/openid-configuration of its own.

    ACORD posture: no ACORD reference found. Full-text scans of the homepage,
    the brokers page, the Threatonomics Risk Graph product page and the Risk
    Operations Center page returned zero hits for ACORD, AL3, ACORD XML, NGDS,
    IVANS, agency download, Applied Epic, Vertafore or AMS360. Targeted web
    search for Resilience alongside those terms also returned nothing
    company-specific. For a US specialty cyber carrier this is consistent with
    the market seam: Resilience underwrites directly through appointed broker
    relationships and its own portal rather than through the IVANS/agency-download
    plumbing that moves personal and commercial lines between carriers and agency
    management systems.

    Quote / bind / issue / FNOL: none are exposed as a public API. Quoting and
    binding happen through broker submission and the gated portal; FNOL is a
    human process — the site routes claims to /en-gb/file-a-claim/ and a 24/7
    in-house claims and incident-response team, not to an endpoint. The only
    self-serve interactive tool on the public estate is a marketing lead-capture
    calculator at building.cyberresilience.com/cyber-risk-calculator.

    Note on "API" language in third-party write-ups: Resilience's own material
    describes integrating with a client's third-party cloud services and internal
    systems to run continuous risk assessment. That is Resilience CONSUMING
    customer-side APIs as an inbound data collector; it is not Resilience
    PUBLISHING an API. No connector catalog, integration directory or event
    documentation is public.
