actions:
  openapiPath: null
  apisYmlUpdated: true
  reason: |
    Honest stub. Resilience exposes no public self-serve API surface, so apis[]
    is intentionally empty. The record captures identity, the real gated
    integration surface (Auth0 + private product API audience), and the
    sector-defining negative signal: a US specialty cyber carrier with no ACORD,
    AL3, NGDS or IVANS posture at all. That absence is the measurement.
