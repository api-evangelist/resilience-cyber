      note: Broker submission and gated portal only. No public quote/rating API.
    bind:
      exposed: false
      note: Underwriter-mediated through appointed brokers. No public bind API.
    issue:
      exposed: false
      note: Policy issuance and documents delivered through the gated portal.
    fnol:
      exposed: false
