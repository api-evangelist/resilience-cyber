    audience: partner-only (appointed brokers and existing policyholders)
  authModel:
    scheme: OAuth 2.0 authorization-code with PKCE (S256) via Auth0
    issuer: https://auth.cyberresilience.com/
    authorizationEndpoint: https://auth.cyberresilience.com/authorize
    tokenEndpoint: https://auth.cyberresilience.com/oauth/token
    jwksUri: https://auth.cyberresilience.com/.well-known/jwks.json
    audience: https://api.prod.resilienceinsurance.app
    grantTypesSupported:
      - client_credentials
      - authorization_code
    scopesSupported:
      - openid
      - profile
      - offline_access
      - email
    note: >-
      Standard Auth0 tenant metadata, fetched anonymously. The scopes advertised
      are Auth0/OIDC defaults, NOT product scopes — no insurance-domain scopes
      (policy, quote, claim) are published anywhere. client_credentials appears
      in tenant metadata but no partner client-credentials onboarding is
      documented publicly.
